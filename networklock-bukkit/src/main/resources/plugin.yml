name: NetworkLock
main: dev.korinetwork.networklock.bukkit.NetworkLockBukkit
version: "${version}"
api-version: "1.13"
load: STARTUP
folia-supported: true
description: Makes players join your servers only through your proxy.
website: https://kori.my
authors: [DarkZmaj]

permissions:
  networklock.admin:
    description: All NetworkLock commands.
    default: op
    children:
      networklock.command.help: true
      networklock.command.status: true
      networklock.command.reload: true
      networklock.command.doctor: true
      networklock.command.stats: true
      networklock.command.proxies: true
      networklock.command.about: true
      networklock.notify: true
  networklock.command.help:
    default: op
  networklock.command.status:
    default: op
  networklock.command.reload:
    default: op
  networklock.command.doctor:
    default: op
  networklock.command.stats:
    default: op
  networklock.command.proxies:
    default: op
  networklock.command.about:
    default: op
  networklock.notify:
    description: Get told about new NetworkLock versions on join (proxy).
    default: op
